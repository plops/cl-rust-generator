[package]
name = "unicode_ocr"
version = "0.1.0"
edition = "2024"
description = "Unicode OCR round trip: GNU Unifont samples in many languages rendered and read back with PaddleOCR (ONNX)"

[dependencies]
fontdue = "0.9.4"
macroquad = { version = "0.4.16", default-features = false }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "copy-dylibs", "tls-native"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
