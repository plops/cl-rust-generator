# Canon four-group zoom (US 5,146,366 A, Mukaiya), Numerical Example 1.
# Classic mechanically-compensated zoom: G1 positive (fixed for zoom) /
# G2 negative variator (moves) / G3 negative compensator (moves) /
# G4 positive relay (fixed). Variable-power ratio ~5.7x, FNO 2.0-2.3.
# Source: https://patents.google.com/patent/US5146366A/en (expired).
#
# ---- MIDDLE ZOOM: F = 2.50, FNO ~2.1, 2w between wide and tele ----
# Only the three variable air spaces differ from the wide config:
#   D5=1.32, D10=0.63, D12=0.42 (patent units, F=1.0 normalization).

[source]
grid_radius = 0.15
ray_count = 25
wavelengths = [0.4861, 0.5876, 0.6563]
# Middle zoom: half-field between wide (~22.6 deg) and tele (~4.2 deg).
field_angles_deg = [0.0, 6.0, 12.0]

# ---- Group 1: positive, fixed during zooming (front) ----
[[surfaces]]
name = "G1 L1 front"
radius = 12.783
thickness = 0.139
material = 1.80518 # vd 25.4

[[surfaces]]
name = "G1 L1/L2 cemented"
