# Canon four-group zoom (US 5,146,366 A, Mukaiya), Numerical Example 1.
# Classic mechanically-compensated zoom: G1 positive (fixed for zoom) /
# G2 negative variator (moves) / G3 negative compensator (moves) /
# G4 positive relay (fixed). Variable-power ratio ~5.7x, FNO 2.0-2.3.
# Source: https://patents.google.com/patent/US5146366A/en (expired).
#
# ---- WIDE-ANGLE END: F = 1.00, FNO = 2.0, 2w = 45.24 deg ----
# Patent normalizes F = 1.0 (dimensionless). radius/thickness carry the same
# scale. Variable air spaces for this position: D5=0.16, D10=2.03, D12=0.18.
# `material` is n_d after the surface (air = 1.0), matching the tracer.
# R26/R27 (planes) are the cover glass / filter, per the patent.

[source]
# F/2.0 at F=1.0 -> entrance pupil diameter 0.5 in patent units. A working
# grid_radius of 0.15 keeps the traced fan inside the clear apertures of the
# steep front group (the full 0.25 overfills the first surfaces); the aperture
# stop's own clear radius (diameter below) is the intended limiter, and
# per-field pupil-aiming positions each oblique bundle onto it.
grid_radius = 0.15
ray_count = 25
wavelengths = [0.4861, 0.5876, 0.6563]
# Patent wide 2w = 45.24 deg -> half-field ~22.6 deg. Sampled 0 / 11 / 22 deg.
field_angles_deg = [0.0, 11.0, 22.0]

# ---- Group 1: positive, fixed during zooming (front) ----
