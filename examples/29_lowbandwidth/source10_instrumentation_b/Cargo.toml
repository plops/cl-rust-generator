[workspace]
resolver = "3"
members = ["common", "log", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wol Pumba <wolpumba@gmail.com>"]
license = "MIT"

[profile.release]
opt-level = 3

# Debug-Builds: Abhängigkeiten optimieren (Encoder/Decoder sonst ~20x langsamer).
[profile.dev.package."*"]
opt-level = 3
# Prüfstand-Test (`client/tests/realdata.rs`) läuft in Echtzeit gegen einen
# 6-kB/s-Kanal — unoptimiert verpasst er Frames. Eigene Crates daher -O1.
[profile.dev.package.lbw-client]
opt-level = 1
[profile.dev.package.lbw-server]
opt-level = 1
