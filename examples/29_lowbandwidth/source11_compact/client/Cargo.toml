[package]
name = "lbw-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:macroquad"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lbw-common = { path = "../common" }
lbw-tunnel = { path = "../tunnel" }
macroquad = { version = "0.4.16", optional = true }
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
ttf-parser = "0.24"

[dev-dependencies]
lbw-server = { path = "../server" }
# Nur tests/loopback.rs baut sein Schirmbild selbst (kein X11 nötig).
image = { version = "0.24", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
