[package]
name = "lbw-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
lbw-common = { version = "0.1.0", path = "../common" }
macroquad = { version = "0.4.16", default-features = false, optional = true }
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8"] }

[features]
default = ["desktop"]
# Fenster, Rendering und Tastatur über macroquad (Desktop-Binary).
desktop = ["dep:macroquad"]

[[bin]]
name = "lbw-client"
path = "src/main.rs"
required-features = ["desktop"]
