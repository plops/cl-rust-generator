[package]
name = "dating-mvp"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hmac = "0.13.0"
http = "1.5.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
