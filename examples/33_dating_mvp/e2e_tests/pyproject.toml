[project]
name = "e2e-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wol pumba", email = "wolpumba@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[project.scripts]
e2e-tests = "e2e_tests:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["e2e: end-to-end browser flows against a live server"]
