[package]
name = "sph"
version = "0.1.0"
edition = "2024"

[workspace]

# Das Binär braucht den Geräte-Anker und wird ohne `gpu`-Feature
# übersprungen (required-features); main.rs hat keine Unit-Tests.
[[bin]]
name = "sph"
path = "src/main.rs"
test = false
required-features = ["gpu"]

[[bench]]
name = "throughput"
harness = false

[dependencies]
# cuda-oxide Single-Source GPU: alle drei Crates aus derselben gepinnten
# Revision, sonst bricht die Typ-Unifikation (E0277/E0308, siehe deps.md).
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977" }
macroquad = "0.4"
glam = "0.27"
bytemuck = { version = "1", features = ["derive"] }
lexopt = "0.3"

[features]
# Deaktiviert per Default, damit plain `cargo test`/`cargo clippy` ohne
# Device-Bundle linken. GPU-Läufe brauchen `--features gpu` (oxide).
gpu = []
