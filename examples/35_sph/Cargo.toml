[package]
name = "sph"
version = "0.1.0"
edition = "2024"

[workspace]

# main.rs hat keine Unit-Tests. Ohne `gpu`-Feature linkt das Binär plain
# (reines CPU-Programm, kein Geräte-Anker erreichbar); mit `gpu`-Feature
# braucht es das Oxide-Backend (`cargo oxide run --features gpu`).
[[bin]]
name = "sph"
path = "src/main.rs"
test = false

[[bench]]
name = "throughput"
harness = false

[dependencies]
# cuda-oxide Single-Source GPU: alle drei Crates aus derselben gepinnten
# Revision, sonst bricht die Typ-Unifikation (E0277/E0308, siehe deps.md).
# Optional, damit CPU-only-Systeme ohne CUDA-Toolkit bauen können
# (cuda-bindings braucht cuda.h + libclang schon zum Kompilieren).
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977", optional = true }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a0cc6cc0bc18722ec5cdfbea136c118a7c051977", optional = true }
macroquad = "0.4"
glam = "0.27"
bytemuck = { version = "1", features = ["derive"] }
lexopt = "0.3"
rayon = "1"

[features]
# Deaktiviert per Default: plain `cargo build/test/clippy` braucht dann
# weder GPU noch CUDA-Toolkit (reiner CPU-Betrieb). GPU-Läufe brauchen
# `cargo oxide run --features gpu`.
gpu = ["dep:cuda-device", "dep:cuda-host", "dep:cuda-core"]
