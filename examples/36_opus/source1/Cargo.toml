[package]
name = "opus-vis"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Opus-Datei visualisieren: Modi, Bandbreite, Bitrate, Spektrum-Wasserfall"

[dependencies]
minifb = { version = "0.29", default-features = false, features = ["x11"], optional = true }
opus-pure = "0.2"

[features]
show = ["dep:minifb"]

[profile.release]
opt-level = 3

[dev-dependencies]
opus-pure = "0.2"
