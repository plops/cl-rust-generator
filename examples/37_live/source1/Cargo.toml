[package]
name = "live-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Raum-Relay fuer Live-AI-Dolmetscher: leitet PCM-Binaerframes an Peers im gleichen Raum weiter"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-tungstenite = "0.28"
reqwest = "0.12"
