[package]
name = "live-silk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Raum-Relay fuer Live-AI-Dolmetscher mit Opus-SILK-Sparmodus fuer langsame Mobilverbindungen"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3.34"
opus-pure = "0.2.2"
# genau ein Crypto-Provider (ring), sonst panict rustls beim ersten wss-Connect
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
